plugins {
    id 'com.android.application'
}

// Signing comes from the CI environment (GitHub Actions secrets). Without them the
// build still runs, signed with the throwaway debug key, so the project is always checked.
def ks = System.getenv("KEYSTORE_PATH")
def hasReleaseKey = ks != null && new File(ks).exists()

android {
    namespace 'com.wtrline.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.wtrline.app"
        minSdk 21
        targetSdk 35
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("VERSION_NAME") ?: "1.0")
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "waterline"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
