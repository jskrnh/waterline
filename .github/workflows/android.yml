# Builds the Waterline Android app (a Trusted Web Activity around https://wtrline.com)
# and publishes the signed APK on the repository's Releases page.
#
# One-time setup: Settings → Secrets and variables → Actions → New repository secret
#   ANDROID_KEYSTORE_B64       the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them the build still runs (with a throwaway key) but nothing is published.

name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Release key not set::Add ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions. This build is signed with a throwaway key and is not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: waterline
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            # surface the cause as one annotation, so it is readable without opening the log
            msg=$(awk '/What went wrong/{f=1} f{print} /Try:/{exit}' build.log | head -25)
            [ -z "$msg" ] && msg=$(grep -iE "error|exception" build.log | head -20)
            echo "::error title=Gradle build failed::$(printf '%s' "$msg" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi

      - name: Inspect APK
        id: apk
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="waterline-1.${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          CERT=$("$BT/apksigner" verify --print-certs "$OUT" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          BADGE=$("$BT/aapt2" dump badging "$OUT" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" | tr '\n' ' ')
          SIZE=$(du -k "$OUT" | cut -f1)
          echo "::notice title=APK::${OUT} · ${SIZE} KB · cert SHA-256 ${CERT} · ${BADGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: waterline-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.${{ github.run_number }}
          name: Waterline for Android 1.${{ github.run_number }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            **Waterline for Android** — opens [wtrline.com](https://wtrline.com) full-screen, so it always runs the latest version of the site.

            **Install:** open this page on your phone, tap the `.apk` below, and allow your browser to install apps when Android asks. Chrome needs to be installed (it is on almost every Android phone).
